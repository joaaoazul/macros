name: Android

# Compila o APK Android (Capacitor) e publica-o como artefacto do workflow.
# Os runners do GitHub já trazem o Android SDK, por isso não é preciso instalar
# nada à mão.
#
# Variável opcional (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_ORIGIN — origem da API usada pela build nativa.
#                     Sem ela usa-se o valor por omissão em src/lib/native.ts.
#
# Para uma build assinada de release (Play Store), ver a secção Android do README.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Build web + typecheck
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: npm run build

      - name: Sincronizar o projeto Android
        run: npx cap sync android

      - name: Compilar o APK de debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: macros-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # AAB assinado para a Play Store. Só corre a pedido e com os secrets postos —
  # ver docs/PLAY_STORE.md para os gerar.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Keystore em falta
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Secret ANDROID_KEYSTORE_BASE64 não configurado — sem AAB assinado."
          echo "Ver docs/PLAY_STORE.md."

      - uses: actions/setup-node@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'

      - name: Build web
        if: env.HAS_KEYSTORE == 'true'
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: npm ci && npm run build && npx cap sync android

      - name: Repor a keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/macros.keystore"

      - name: Compilar o AAB assinado
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/macros.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # a Play Store exige um versionCode novo a cada upload
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: macros-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Apagar a keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/macros.keystore"
